# Hand-kept inputs of scripts/make_web_licences.py (W9.5b). Read them with the lock and the
# version pins to write web/app/public/THIRD_PARTY_LICENSES.txt.
#
# - pyodide / pymupdf: must equal web/spike/versions.json. A version bump fails the check until the
#   Pyodide or PyMuPDF components below are reviewed and this key is updated.
# - [[component]]: each non-npm part of the web engine that ships to the browser.
# - [npm."<name>"]: the copyright line of each runtime npm package in web/app/package-lock.json.
#   The lock has no copyright holders, so they are kept here after reading each package's licence
#   file. The generator never reads node_modules.
#
# A note starting "To confirm" marks a fact that is not verified from this repository (the Pyodide
# or Emscripten sources, or the wasm build's contents). Do not drop the note until it is checked.

pyodide = "314.0.8"
pymupdf = "1.28.2"

