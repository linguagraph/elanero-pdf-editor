name = "Pyodide"
version = "314.0.8"
license = "MPL-2.0"
url = "https://pyodide.org"
copyright = ["Copyright (c) Pyodide contributors"]
note = "To confirm: the copyright line against the Pyodide 314.0.8 sources."

