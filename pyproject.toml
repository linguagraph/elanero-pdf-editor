[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfeditor"
version = "0.4.1"
description = "Acrobat-style desktop PDF editor built on an abstract engine layer (PyMuPDF backend) and PySide6."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    # PyMuPDF is capped to 1.28.x because the in-place save calls its internals (see
    # engine/mupdf/document.py incremental_bytes), checked against 1.28.2 only. Re-check that code
    # and tests/engine/test_mupdf_incremental.py before raising the cap.
    "pymupdf>=1.28.2,<1.29",
    # Capped until the PySide6 6.12 changes are adopted: they break tests (table export, a
    # native crash in the 1000-page scroll benchmark).
    "PySide6>=6.12.0,<6.13",
    "pikepdf>=8.0",
    "fonttools>=4.47",
    "Pillow>=13.0.0",
    # Digital signing (MIT). Capped: services/signing/_pdf.py hooks pyHanko's stamp internals.
    "pyhanko>=0.38.1,<0.39",
    # USB tokens through a PKCS#11 module (MIT); the range is the one pyHanko supports.
    "python-pkcs11~=0.9.3",
    # Microsoft Store updates (MIT, pywinrt), Windows only. Imported lazily, and only by the
    # Store build (services/store_updates.py). Foundation is what the Store projection returns.
    "winrt-runtime>=4.1.0; sys_platform == 'win32'",
    "winrt-Windows.Services.Store>=4.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=4.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=4.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
# The user guide site (docs/guide, mkdocs.yml). Docs tooling only: never a runtime dependency.
# Pinned: the docs workflow installs exactly these. Both are MIT.
docs = ["mkdocs==1.6.1", "mkdocs-material==9.8.0"]
dev = [
    "pytest>=9.2.0,<9.3",  # 9.2 breaks pytest-benchmark 5.3 (Function._nodeid)
    "pytest-qt>=4.3",
    "pytest-benchmark>=4.0",
    "pytest-xdist>=3.8.0",  # parallel runs (-n auto); MIT
    "hypothesis>=6.90",
    "pypdfium2>=4.20",
    "ruff>=0.4",
    "mypy>=1.8",
    "import-linter>=2.0",
    "pre-commit>=3.6",
    "pyyaml>=6.0",  # the guide tests read mkdocs.yml and the docs workflow
    "numpy>=1.26",  # pixel comparisons in tests only (the app itself uses Pillow)
    "pip-audit>=2.7",  # dependency audit, nightly security-audit.yml only; Apache-2.0
]

[project.scripts]
pdfeditor = "pdfeditor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfeditor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".claude", "src/pdfeditor/data"]  # agent worktrees; bundled data

[tool.ruff.format]
# Code blocks in Markdown (design notes, the guide) are sketches laid out by hand.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# test data in Cyrillic/other scripts is intentional
"tests/**" = ["RUF001"]
"scripts/make_fixtures.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["pdfeditor"]
exclude = ["src/pdfeditor/data/"]  # bundled data (the branding pack ships a verifier script)
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# "strict" can't be set per module; these are its per-module equivalents.
module = [
    "pdfeditor.model.*",
    "pdfeditor.engine.base",
    "pdfeditor.core.*",
    "pdfeditor.actions",
    "pdfeditor.actions.*",
    "pdfeditor.webapi",
    "pdfeditor.webapi.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
# PyMuPDF's bundled hints are partial and constants are created dynamically.
module = ["pymupdf", "pymupdf.*", "fitz"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# pywinrt's stubs use Python 3.12 syntax (class IIterable[T]), which mypy rejects for 3.11.
# They are installed on Windows only, so without this mypy fails there and passes on Linux.
module = ["winrt", "winrt.*"]
follow_imports = "skip"
follow_imports_for_stubs = true  # the syntax error is in a .pyi, which "skip" alone still reads

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --benchmark-disable"
qt_api = "pyside6"
markers = [
    "slow: long-running tests (large fixtures, OCR)",
    "gui: tests that need a Qt application",
    "network: talks to a real translation service; runs only with ELANERO_LIVE_TRANSLATION=1",
    "desktop_only: needs the Windows desktop app (Qt, packaging, OCR, signing, PDF/A, stores, LibreOffice, live services); excluded from the Pyodide run",
]

[tool.importlinter]
root_package = "pdfeditor"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "pdfeditor.ui | pdfeditor.webapi",
    "pdfeditor.actions",
    "pdfeditor.services",
    "pdfeditor.core",
    "pdfeditor.engine",
    "pdfeditor.model",
]

[[tool.importlinter.contracts]]
name = "Only the mupdf backend may import PyMuPDF"
type = "forbidden"
source_modules = [
    "pdfeditor.model",
    "pdfeditor.core",
    "pdfeditor.services",
    "pdfeditor.actions",
    "pdfeditor.ui",
    "pdfeditor.webapi",
    "pdfeditor.engine.base",
    "pdfeditor.engine.registry",
    "pdfeditor.engine.contentstream",
    "pdfeditor.engine.deskew",
]
forbidden_modules = ["fitz", "pymupdf"]

[[tool.importlinter.contracts]]
# The shared layers below the front ends run without Qt.
name = "Web and shared layers stay Qt-free"
type = "forbidden"
source_modules = ["pdfeditor.actions"]
forbidden_modules = ["PySide6", "shiboken6"]

[[tool.importlinter.contracts]]
# The browser RPC (W3.2) runs in Pyodide, where Qt does not exist.
name = "webapi stays Qt-free"
type = "forbidden"
source_modules = ["pdfeditor.webapi"]
forbidden_modules = ["PySide6", "shiboken6"]
