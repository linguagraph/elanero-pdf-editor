# Dependabot version updates. Weekly, and grouped so one run opens a few pull requests, not one
# per package. Minor and patch updates share a group per ecosystem; major updates stay separate
# so each can be reviewed on its own. Security updates are not limited by this schedule.
# Alerts for known advisories come from the nightly security-audit.yml run, not from here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The Node types must match the runtime we ship on; bump them by hand with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web/spike
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      spike-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
