name: Security audit (nightly, manual)

# Dependency audits (W8.6 S7, finding F3). Nightly and on demand only: an advisory can appear
# without any code change, so these checks never gate a pull request (AGENTS.md; W8.6 decision 4).
# No job here is a required check. A failure names the advisory id in its log.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-npm:
    name: npm audit (web/app, production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned Node version
        id: versions
        run: echo "node=$(jq -r .node web/spike/versions.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install the npm packages (exact, from the lockfile, no install scripts)
        working-directory: web/app
        run: npm ci --ignore-scripts
      - name: Audit the production dependencies (fails on high or critical)
        working-directory: web/app
        run: npm audit --omit=dev --audit-level=high

  audit-pip:
    # pip-audit reports advisories without a severity grade, so any advisory fails this job.
    name: pip-audit (Python dev environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Install the dev extra (pip-audit is in it)
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[dev]"
      - name: Audit the installed packages
        run: uv run --no-sync pip-audit --desc on
