name: Web pytest (W2.7a)

# The web test run (W2.7a): the repo's tests, minus the desktop_only ones, under Pyodide in Node,
# against the web package (scripts/build_web_wheel.py). It is not a required check (W1.7 decision
# 3). Its PyMuPDF wasm wheel is the spike's route-3 build, copied from web-spike.yml with the same
# cache key shape, so it is built once per versions.json change. The steps for the wheel are copies:
# keep them in step with web-spike.yml until the spike is retired.

on:
  workflow_dispatch:
  # ci.yml calls this for every pull request (its web-tests job) and passes `run_web`, whether the
  # pull request changes the web.
  workflow_call:
    inputs:
      run_web:
        description: >-
          'true' or 'false': whether the pull request changes the web. The job always runs, so its
          check always reports; 'false' skips every step, and the job passes.
        type: string
        default: 'true'
  pull_request:
    paths:
      - "web/**"
      - "scripts/build_web_wheel.py"
      - "scripts/web_package.py"
      - "src/pdfeditor/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/web-pytest.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-pytest:
    name: web-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        if: ${{ inputs.run_web != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned versions
        if: ${{ inputs.run_web != 'false' }}
        id: versions
        run: |
          v=web/spike/versions.json
          {
            echo "pyodide=$(jq -r .pyodide $v)"
            echo "python_line=$(jq -r .pythonLine $v)"
            echo "pyodide_build=$(jq -r .pyodideBuild $v)"
            echo "pymupdf=$(jq -r .pymupdf $v)"
            echo "pymupdf_tag=$(jq -r .pymupdfTag $v)"
            echo "pymupdf_commit=$(jq -r .pymupdfTagCommit $v)"
            echo "node=$(jq -r .node $v)"
            echo "mupdf_url=$(jq -r .mupdfSourceUrl $v)"
            echo "mupdf_sha=$(jq -r .mupdfSourceSha256 $v)"
            echo "route=$(jq -r .wheelRoute $v)"
            echo "host_python=$(jq -r .hostPython $v)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: ${{ inputs.run_web != 'false' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      # web/spike/package.json is the one package.json: it pins Pyodide, and the runner reads the
      # installed package from web/spike/node_modules.
      - name: Install the npm packages (exact, from the lockfile)
        if: ${{ inputs.run_web != 'false' }}
        working-directory: web/spike
        run: npm ci --ignore-scripts

      - name: Restore the PyMuPDF wheel from the cache
        if: ${{ inputs.run_web != 'false' }}
        id: wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/spike/dist/wheel-build
          key: pymupdf-${{ steps.versions.outputs.pymupdf }}-pyodide-${{ steps.versions.outputs.pyodide }}-${{ hashFiles('.github/workflows/web-pytest.yml', 'web/spike/versions.json') }}

      # Route 3 (the one that matters for Pyodide 314): build the wheel with PyMuPDF's own
      # Pyodide route, at the tag. The MuPDF it bundles is used as is.
      - name: Set up Python for the Pyodide build
        if: ${{ inputs.run_web != 'false' && ((steps.wheel-cache.outputs.cache-hit != 'true' && steps.versions.outputs.route == 'build')) }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.python_line }}

      - name: Build the PyMuPDF wasm wheel (route 3)
        if: ${{ inputs.run_web != 'false' && ((steps.wheel-cache.outputs.cache-hit != 'true' && steps.versions.outputs.route == 'build')) }}
        env:
          PB: ${{ steps.versions.outputs.pyodide_build }}
          PYODIDE: ${{ steps.versions.outputs.pyodide }}
          PM_TAG: ${{ steps.versions.outputs.pymupdf_tag }}
          PM_COMMIT: ${{ steps.versions.outputs.pymupdf_commit }}
          MU_URL: ${{ steps.versions.outputs.mupdf_url }}
          MU_SHA: ${{ steps.versions.outputs.mupdf_sha }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          work="$RUNNER_TEMP/pymupdf-build"
          mkdir -p "$work"
          python -m venv "$work/venv"
          . "$work/venv/bin/activate"
          python -m pip install --quiet "pyodide-build==$PB"
          pyodide xbuildenv install "$PYODIDE"
          git clone --quiet --depth 1 --branch "$PM_TAG" https://github.com/pymupdf/PyMuPDF.git "$work/PyMuPDF"
          # MuPDF 1.28.2, the version the tag bundles, from its release tarball (checked by sha256).
          # One line of its SWIG generator is patched: a dead-code call to a Python 2 name that the
          # 1.28.x branch has already changed to PyUnicode_FromString. The version is unchanged.
          curl -fsSL -o "$work/mupdf.tar.gz" "$MU_URL"
          echo "$MU_SHA  $work/mupdf.tar.gz" | sha256sum -c -
          tar -xzf "$work/mupdf.tar.gz" -C "$work"
          mu_dir="$work/$(jq -r .mupdfSourceDir web/spike/versions.json)"
          # Two Python 2 names, each patched to its Python 3 name. A target must hold exactly one
          # PyString_FromString before the patch (so a new upstream layout fails here, loudly),
          # and none after it.
          patch_once() {
            local n
            n=$(grep -c 'PyString_FromString' "$1" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error::expected exactly one PyString_FromString in $1, found $n"
              exit 1
            fi
            sed -i 's/PyString_FromString/PyUnicode_FromString/' "$1"
          }
          sw="$mu_dir/scripts/wrap/swig.py"
          extra="$work/PyMuPDF/src/extra.i"
          patch_once "$sw"
          patch_once "$extra"
          if grep -n 'PyString_' "$sw" "$extra"; then
            echo "::error::PyString_ still present after the patch"
            exit 1
          fi
          export PYMUPDF_SETUP_MUPDF_BUILD="$mu_dir"
          test "$(git -C "$work/PyMuPDF" rev-parse HEAD)" = "$PM_COMMIT"
          cd "$work/PyMuPDF"
          # The flags scripts/test.py sets for its Pyodide build (PyMuPDF 1.28.2). Tesseract is
          # off there, which is why the web build has no OCR. The limited C API is off too: with
          # Python 3.14 the SWIG bindings call PyString_FromString (Python 2 only) and fail to compile.
          export HAVE_LIBCRYPTO=no OS=pyodide PYMUPDF_SETUP_FLAVOUR=pb PYMUPDF_SETUP_MUPDF_TESSERACT=0 PYMUPDF_SETUP_PY_LIMITED_API=0
          pyodide build --exports whole_archive
          out="$GITHUB_WORKSPACE/web/spike/dist/wheel-build"
          mkdir -p "$out" "$GITHUB_WORKSPACE/web/spike/out"
          cp dist/*.whl "$out/"
          end=$(date +%s)
          # wheel.sha256 is saved in the cache with the wheel; the verify step re-hashes it.
          (cd "$out" && sha256sum ./*.whl > wheel.sha256)
          wheel_name=$(basename "$out"/*.whl)
          wheel_sha=$(cut -d' ' -f1 "$out/wheel.sha256")
          jq -n \
            --arg route build \
            --arg pyodide "$PYODIDE" \
            --arg pyodide_build "$PB" \
            --arg pymupdf_tag "$PM_TAG" \
            --arg commit "$PM_COMMIT" \
            --arg python "$(python -c 'import platform; print(platform.python_version())')" \
            --arg emscripten "$(pyodide config get emscripten_version 2>/dev/null || echo unknown)" \
            --arg wheel "$wheel_name" \
            --arg wheel_sha "$wheel_sha" \
            --argjson seconds "$((end - start))" \
            '{route: $route, pyodide: $pyodide, pyodideBuild: $pyodide_build, pymupdfTag: $pymupdf_tag,
              pymupdfCommit: $commit, hostPython: $python, emscripten: $emscripten, wheel: $wheel,
              wheelSha256: $wheel_sha, coldBuildSeconds: $seconds}' > "$GITHUB_WORKSPACE/web/spike/out/build-info.json"

      # Runs on a cache hit too: the wheel and wheel.sha256 come back from the cache together, and
      # the wheel is hashed again here, so a damaged or swapped cache entry fails the run.
      - name: Verify the wheel against wheel.sha256
        if: ${{ inputs.run_web != 'false' }}
        run: |
          set -euo pipefail
          cd web/spike/dist/wheel-build
          test -f wheel.sha256 || { echo "::error::wheel.sha256 missing from the wheel cache"; exit 1; }
          sha256sum -c wheel.sha256

      - name: Set up the host Python (fixtures and the web build)
        if: ${{ inputs.run_web != 'false' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.host_python }}

      - name: Install the host packages and generate the fixtures
        if: ${{ inputs.run_web != 'false' }}
        run: |
          set -euo pipefail
          python -m pip install --quiet $(jq -r '.hostPins | join(" ")' web/spike/versions.json)
          python scripts/make_fixtures.py

      # Stdlib only (scripts/build_web_wheel.py): writes dist/web/pdfeditor-web.zip and manifest.json.
      - name: Build the web package
        if: ${{ inputs.run_web != 'false' }}
        run: python scripts/build_web_wheel.py

      - name: Upload the web package
        if: ${{ inputs.run_web != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-pytest-package
          if-no-files-found: error
          path: dist/web/

      - name: Run the tests under Pyodide (Node)
        if: ${{ inputs.run_web != 'false' }}
        env:
          WEB_ZIP: dist/web/pdfeditor-web.zip
          PYODIDE_SHARDS: ${{ vars.PYODIDE_SHARDS || '2' }}
        run: |
          set -euo pipefail
          [[ "$PYODIDE_SHARDS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::bad PYODIDE_SHARDS"; exit 2; }
          (( PYODIDE_SHARDS <= 8 )) || { echo "::error::PYODIDE_SHARDS is at most 8"; exit 2; }
          n=$(ls web/spike/dist/wheel-build/*.whl | wc -l)
          test "$n" -eq 1 || { echo "expected one PyMuPDF wheel, found $n"; exit 1; }
          export PYMUPDF_WHEEL="$(ls web/spike/dist/wheel-build/*.whl)"
          node web/test/pyodide/run_tests.mjs --stage
          rm -rf web/test/pyodide/out web/test/pyodide/out-*
          pids=()
          for k in $(seq 0 $((PYODIDE_SHARDS-1))); do
            mkdir -p "web/test/pyodide/out-$k"
            node web/test/pyodide/run_tests.mjs --shard "$k/$PYODIDE_SHARDS" >"web/test/pyodide/out-$k/node.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for k in "${!pids[@]}"; do
            if wait "${pids[$k]}"; then code=0; else code=$?; fi
            echo "::group::shard $k (exit $code)"; cat "web/test/pyodide/out-$k/node.log"; echo "::endgroup::"
            (( code > status )) && status=$code
          done
          python scripts/merge_pyodide_shards.py --shards "$PYODIDE_SHARDS" || { c=$?; (( c > status )) && status=$c; }
          exit "$status"

      # The host halves of the migrated checks (W2.7b): pikepdf and pypdfium2 replay what the
      # Pyodide run recorded. Runs even when the Pyodide tests failed, since the manifest is
      # written then too. The host packages are the ones installed above.
      - name: Replay the recorded host checks (host CPython)
        if: ${{ inputs.run_web != 'false' && ((always() && hashFiles('web/test/pyodide/out/host-checks.json') != '')) }}
        run: python scripts/web_host_verify.py web/test/pyodide/out/host-checks.json

      # The ratchet on host-only skips (W2.7b): a module may not exceed its budget, and a module
      # with host-only skips needs a budget entry. The budget file only goes down.
      - name: Check the host-only skip budget
        if: ${{ inputs.run_web != 'false' && (always()) }}
        run: python scripts/check_web_skips.py

      - name: Upload the test output
        if: ${{ inputs.run_web != 'false' && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-pytest-out
          if-no-files-found: warn
          path: |
            web/test/pyodide/out/
            web/test/pyodide/out-*/
            web/spike/out/build-info.json
