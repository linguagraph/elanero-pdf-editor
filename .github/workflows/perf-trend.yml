name: Perf trend

# The performance trend for the latest scheduled CI and Web perf runs on main (W8.3 S5; docs/web/design/W8.3-s5-trend-log.md).
# It runs on a nightly schedule after both of them (CI at 03:00 UTC, Web perf at 05:00 UTC), and on manual dispatch
# for one run id. It reads the perf artifacts of the run and the 14 scheduled runs before it, and writes one table per
# series to the job summary. A drift is a warning annotation, never a failure. Only a script error (gh fails, or no
# results at all) makes this run red. It is not a required check.
#
# A separate workflow, not steps inside ci.yml or web-perf.yml: the gated workflows and release.yml keep
# contents: read, and a trend failure can never turn CI or a release red. The scheduled run reads the default
# branch with this token's two read scopes; no workflow_run trigger, so a push never starts it.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "The scheduled CI or Web perf run to report (its database id)."
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  perf-trend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The default branch's code; the scheduled runs of CI and Web perf are never checked out.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # The latest scheduled run of each workflow on main. gh reads them with this token; the
      # script itself handles no token.
      - name: Find the latest scheduled runs
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for pair in "CI_RUN_ID ci.yml" "WEB_RUN_ID web-perf.yml"; do
            var="${pair% *}"
            workflow="${pair#* }"
            id="$(gh run list --workflow "$workflow" --branch main --event schedule --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::error title=perf-trend::no scheduled run of $workflow on main" >&2
              exit 1
            fi
            echo "$var=$id" >> "$GITHUB_ENV"
          done

      # gh reads the artifacts with this token; the script itself handles no token.
      - name: Write the CI trend to the job summary
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ env.CI_RUN_ID }}
        run: python scripts/perf_trend.py --run-id "$RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the Web perf trend to the job summary
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ env.WEB_RUN_ID }}
        run: python scripts/perf_trend.py --run-id "$RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the trend to the job summary
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: python scripts/perf_trend.py --run-id "$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
