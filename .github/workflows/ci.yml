name: CI

# Pull requests get one run: fast checks first, then the Windows tests and one build of the app.
# Nothing runs again after the merge. The nightly run and every release (release.yml calls this
# workflow) run everything: Linux, the performance budgets and the install tests too.

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Worker counts, set per repository in Settings > Variables (vars.PYTEST_WORKERS).
  PYTEST_WORKERS: ${{ vars.PYTEST_WORKERS || '2' }}
permissions:
  contents: read

jobs:
  changes:
    # What this pull request can affect: scripts/ci_changes.py. Other events run everything.
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
      packaging: ${{ steps.classify.outputs.packaging }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and the branch it merges into
      - id: classify
        run: python3 scripts/ci_changes.py

  checks:
    # Under a minute, so a simple mistake fails before the slow jobs start.
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run mypy

  web:
    # The web gate (Phase W), a required check. It always reports: without web changes every step
    # is skipped and the job passes. It runs the web app's checks, not Playwright (that needs
    # staged assets). The Python tests under Pyodide are web-tests below.
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned Node version
        id: versions
        if: needs.changes.outputs.web == 'true'
        run: echo "node=$(jq -r .node web/spike/versions.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install the npm packages (exact, from the lockfile)
        if: needs.changes.outputs.web == 'true'
        working-directory: web/app
        run: npm ci --ignore-scripts
      - name: Licence notice is up to date (stdlib Python, no uv sync)
        if: needs.changes.outputs.web == 'true'
        run: python3 scripts/make_web_licences.py --check
      - name: Installed npm packages match the lock and their licence files
        if: needs.changes.outputs.web == 'true'
        run: python3 scripts/make_web_licences.py --verify-installed
      - name: Typecheck
        if: needs.changes.outputs.web == 'true'
        working-directory: web/app
        run: npm run typecheck
      - name: Lint
        if: needs.changes.outputs.web == 'true'
        working-directory: web/app
        run: npm run lint
      - name: Format check
        if: needs.changes.outputs.web == 'true'
        working-directory: web/app
        run: npm run format:check
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: needs.changes.outputs.web == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Unit tests
        if: needs.changes.outputs.web == 'true'
        working-directory: web/app
        run: npm test
      - name: Build
        if: needs.changes.outputs.web == 'true'
        working-directory: web/app
        run: npm run build

  web-tests:
    # The web-pytest run (web-pytest.yml, reusable). It always runs, so its check "web-tests /
    # web-pytest" always reports; its steps run only when the pull request changes the web.
    needs: changes
    uses: ./.github/workflows/web-pytest.yml
    with:
      run_web: ${{ needs.changes.outputs.web }}

  web-browser:
    # The PR-level browser specs (W9.1): nine specs under web/app/e2e, on Chromium, against the
    # production build with the engine staged. The wheel comes from the cache web-pytest.yml fills
    # (the same key); a cache miss fails here instead of building it. It always reports; its steps
    # run only when the pull request changes the web. The long-document, visual and key specs stay
    # in the nightly web-e2e run.
    needs: [changes, web-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        id: versions
        if: needs.changes.outputs.web == 'true'
        run: |
          v=web/spike/versions.json
          {
            echo "pyodide=$(jq -r .pyodide $v)"
            echo "pymupdf=$(jq -r .pymupdf $v)"
            echo "node=$(jq -r .node $v)"
            echo "host_python=$(jq -r .hostPython $v)"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Node
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Install the npm packages of the Pyodide pin (web/spike, for the staging)
        if: needs.changes.outputs.web == 'true'
        working-directory: web/spike
        run: npm ci --ignore-scripts
      # The key is web-pytest.yml's key, built from the same two files (see web-e2e.yml).
      - name: Restore the PyMuPDF wheel from the cache
        if: needs.changes.outputs.web == 'true'
        id: wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/spike/dist/wheel-build
          key: pymupdf-${{ steps.versions.outputs.pymupdf }}-pyodide-${{ steps.versions.outputs.pyodide }}-${{ hashFiles('.github/workflows/web-pytest.yml', 'web/spike/versions.json') }}
      - name: Stop on a cache miss (no cold build here)
        if: needs.changes.outputs.web == 'true' && steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::no PyMuPDF wheel in the cache for this key. Run web-pytest.yml (workflow_dispatch) on main first; this job does not build the wheel."
          exit 1
      - name: Verify the wheel against wheel.sha256
        if: needs.changes.outputs.web == 'true'
        run: |
          set -euo pipefail
          cd web/spike/dist/wheel-build
          test -f wheel.sha256 || { echo "::error::wheel.sha256 missing from the wheel cache"; exit 1; }
          sha256sum -c wheel.sha256
      - name: Set up the host Python (fixtures and the web package)
        if: needs.changes.outputs.web == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versions.outputs.host_python }}
      - name: Install the host packages and generate the fixtures
        if: needs.changes.outputs.web == 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet $(jq -r '.hostPins | join(" ")' web/spike/versions.json)
          python scripts/make_fixtures.py
      - name: Build the web package
        if: needs.changes.outputs.web == 'true'
        run: python scripts/build_web_wheel.py
      - name: Stage the engine assets (Pyodide, the PyMuPDF wheel, the web zip)
        if: needs.changes.outputs.web == 'true'
        run: |
          set -euo pipefail
          n=$(ls web/spike/dist/wheel-build/*.whl | wc -l)
          test "$n" -eq 1 || { echo "expected one PyMuPDF wheel, found $n"; exit 1; }
          node scripts/stage_engine_assets.mjs --wheel "$(ls web/spike/dist/wheel-build/*.whl)" --zip dist/web/pdfeditor-web.zip
          test -f web/app/public/engine-assets/pyodide.mjs
          test -f web/app/public/engine-assets/pyodide-lock.json
      - name: Install the npm packages of the app (exact, from the lockfile)
        if: needs.changes.outputs.web == 'true'
        working-directory: web/app
        run: npm ci --ignore-scripts
      - name: Install the browser (chromium) and its system libraries
        if: needs.changes.outputs.web == 'true'
        working-directory: web/app
        run: npx playwright install --with-deps chromium
      # The main config (playwright.config.ts) is the one that holds these specs: they sit in
      # e2e/ itself, not in e2e/features (which playwright.features.config.ts runs). It starts the
      # harness and the production preview itself.
      - name: Run the PR-level browser specs (chromium)
        if: needs.changes.outputs.web == 'true'
        working-directory: web/app
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: >-
          npx playwright test -c playwright.config.ts --project=chromium --reporter=list,html
          app-start.spec.ts engine-load.spec.ts file-launch.spec.ts forced-colours.spec.ts
          layout.spec.ts open-during-load.spec.ts pwa.spec.ts ribbon.spec.ts split-job.spec.ts
          open-recent.spec.ts recent-previews.spec.ts
      - name: Upload the Playwright report and traces
        if: ${{ always() && needs.changes.outputs.web == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-report
          if-no-files-found: warn
          path: |
            web/app/playwright-report/
            web/app/test-results/

  test-windows:
    needs: [changes, checks]
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]"
      # Again here: Windows-only Qt calls exist only in the stubs installed on Windows.
      - run: uv run mypy
      - run: uv run python scripts/make_fixtures.py
      - run: uv run python scripts/fetch_tessdata.py
      # A busy runner fails the performance budgets by itself (#104), so pull requests leave them
      # to the nightly run and releases. Pull requests also skip the slow tests (the long fuzz
      # runs, #484), which otherwise run past the job's time limit. The nightly run and releases
      # run everything.
      - name: pytest (pull request)
        if: github.event_name == 'pull_request'
        run: uv run pytest -n "${{ env.PYTEST_WORKERS }}" --ignore=tests/benchmarks -m "not slow"
      - name: pytest (nightly and release)
        if: github.event_name != 'pull_request'
        run: |
          uv run pytest -n "${{ env.PYTEST_WORKERS }}" --ignore=tests/benchmarks
          # The budgets run serially: the xdist workers skip them.
          uv run pytest tests/benchmarks

      # The desktop performance numbers for the trend (perf-trend.yml, W8.3 S5). Kept 90 days; not on
      # pull requests. Written by tests/benchmarks/conftest.py, so it exists only after the budgets ran.
      - name: Upload the desktop perf results (trend)
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-desktop-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: .perf/perf-results.json
          if-no-files-found: warn
          retention-days: 90

  test-linux:
    # Offscreen Qt differs enough here to find real bugs, but nothing ships for Linux.
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # Print a Python stack on a native abort (exit 134 in tests/benchmarks/test_ui_budgets.py).
      PYTHONFAULTHANDLER: "1"
      # Hosted Ubuntu runners draw the window about 3x slower than the dev baseline and
      # vary run to run (239-347 ms against the 300 ms first-paint budget): give them headroom
      # without hiding a real regression (tests/benchmarks/test_ui_budgets.py).
      PDFEDITOR_PERF_FACTOR: "1.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run python scripts/make_fixtures.py
      - run: uv run python scripts/fetch_tessdata.py
      - run: uv run pytest -n "${{ env.PYTEST_WORKERS }}" --ignore=tests/benchmarks
      - run: uv run pytest tests/benchmarks

      # The desktop performance numbers for the trend (perf-trend.yml, W8.3 S5). Kept 90 days; not on
      # pull requests. Written by tests/benchmarks/conftest.py, so it exists only after the budgets ran.
      - name: Upload the desktop perf results (trend)
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-desktop-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: .perf/perf-results.json
          if-no-files-found: warn
          retention-days: 90

  build:
    # One PyInstaller run writes the portable exe and the app folder, and every package is made
    # from those: this is the only place a pipeline builds the app. It's self-tested frozen every
    # time. The installer and MSIX install tests run when packaging changed, nightly and on release.
    needs: [changes, checks]
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the upgrade test reads the old installer script from history
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[build]"
      # Our own launcher: the prebuilt one is flagged by antivirus (#90). MSVC is on the image.
      - run: uv run python scripts/build_bootloader.py
      - run: uv run python scripts/build_exe.py --all --clean-env --no-window-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elanero-exe
          path: dist/Elanero.exe
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: elanero-folder
          path: dist/Elanero/
          retention-days: 14
      - name: Install Inno Setup if the image lacks it
        if: needs.changes.outputs.packaging == 'true'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer from this build
        if: needs.changes.outputs.packaging == 'true'
        run: uv run python scripts/build_exe.py --skip-build --installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.packaging == 'true'
        with:
          name: elanero-installer
          path: dist/pdfeditor-*-setup.exe
          retention-days: 14
      # Upgrade a real one-file install made with the last installer of that era (issue #95).
      - name: Upgrade a one-file install, self-test it, uninstall it
        if: needs.changes.outputs.packaging == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $silent = '/VERYSILENT', '/CURRENTUSER', '/NORESTART', '/SUPPRESSMSGBOXES'
          function Run-Setup($exe, $arguments) {
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe exited with $($p.ExitCode)" }
          }
          $app = "$env:LOCALAPPDATA\Programs\pdfeditor"
          $command = 'HKCU:\Software\Classes\pdfeditor.pdf\shell\open\command'
          $old = "$env:RUNNER_TEMP\old"
          New-Item -ItemType Directory $old | Out-Null

          # The old install: the same exe path, the app inside one file.
          $script = (git show 5c54fca:packaging/installer.iss) -join "`n"
          $script = $script.Replace('@VERSION@', '0.0.1').Replace('@EXE@', "$PWD\dist\Elanero.exe")
          $script = $script.Replace('@OUTDIR@', $old).Replace('@LICENSE@', "$PWD\LICENSE")
          $script = $script.Replace('@ICON@', "$PWD\src\pdfeditor\data\branding\elanero\icons\platform\elanero.ico")
          Set-Content "$old\old.iss" $script
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "$old\old.iss"
          if ($LASTEXITCODE -ne 0) { throw 'old installer did not compile' }
          Run-Setup "$old\pdfeditor-0.0.1-setup.exe" $silent
          if (Test-Path "$app\_internal") { throw 'the old install should be one file' }
          if (-not (Test-Path "$app\Elanero.exe")) { throw 'old install missing' }
          # What a previous folder version could leave behind.
          New-Item -ItemType Directory "$app\_internal" | Out-Null
          Set-Content "$app\_internal\stale.dll" 'stale'

          $setup = Get-ChildItem dist\pdfeditor-*-setup.exe | Select-Object -First 1
          "installer: $([math]::Round($setup.Length / 1MB, 1)) MB"
          Run-Setup $setup.FullName $silent
          if (Test-Path "$app\_internal\stale.dll") { throw 'stale file survived the upgrade' }
          if (-not (Test-Path "$app\_internal\python311.dll")) { throw 'app folder not installed' }
          if ((Get-Item "$app\Elanero.exe").Length -gt 30MB) { throw 'still the one-file exe' }
          $expected = "`"$app\Elanero.exe`" `"%1`""
          if ((Get-Item $command).GetValue('') -ne $expected) { throw 'association does not point at the exe' }
          $report = "$env:RUNNER_TEMP\installer-selftest.txt"
          $p = Start-Process -FilePath "$app\Elanero.exe" -ArgumentList '--self-test','--self-test-report',$report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          if (-not (Select-String -Path $report -Pattern 'channel: Installer' -Quiet)) { throw 'not detected as installed' }

          Run-Setup "$app\unins000.exe" '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES'
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep 1 } # it finishes from a temp copy
          if (Test-Path $app) { Get-ChildItem -Recurse $app | Select-Object -First 20 FullName; throw 'files left after uninstall' }
          if (Test-Path $command) { throw 'registry left after uninstall' }
      # The Microsoft Store package with the test identity (the real one is git-ignored), installed
      # the way a Store user gets it, self-tested through its execution alias.
      - name: Package the MSIX from this build
        if: needs.changes.outputs.packaging == 'true'
        run: uv run python scripts/build_exe.py --skip-build --msix --sign-test
      - name: Install the package, self-test it, uninstall it
        if: needs.changes.outputs.packaging == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem dist\Elanero-*-x64.msix | Select-Object -First 1
          # Trust the test certificate the build signed with (the runner is an administrator).
          $password = uv run python -c "import sys; sys.path.insert(0, 'scripts'); import msix_package; print(msix_package.TEST_PFX_PASSWORD)"
          $pfx = Get-PfxData -FilePath build\msix\test-signing.pfx `
              -Password (ConvertTo-SecureString $password -AsPlainText -Force)
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('TrustedPeople', 'LocalMachine')
          $store.Open('ReadWrite'); $store.Add($pfx.EndEntityCertificates[0]); $store.Close()
          Add-AppxPackage -Path $msix.FullName
          $pkg = Get-AppxPackage -Name 'LinguaGraph.ElaneroPDFEditor'
          if (-not $pkg) { throw 'package not installed' }
          $report = "$env:RUNNER_TEMP\msix-selftest.txt"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\Elanero.exe"
          $p = Start-Process -FilePath $alias -ArgumentList '--self-test','--self-test-report',$report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          if (-not (Select-String -Path $report -Pattern 'channel: Microsoft Store' -Quiet)) { throw 'not detected as packaged' }
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name 'LinguaGraph.ElaneroPDFEditor') { throw 'package still installed' }
