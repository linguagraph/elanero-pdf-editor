name: Translation CORS check (W0.3)

# The W0.3 spike (docs/web/design/W0.3.md): can a browser page on linguagraph.github.io call the four
# translation services directly? It sends one request per service, endpoint and origin, with fake
# keys and the word "Hello". Manual only, because it calls external services. Spike only: it ships
# nothing, and no other workflow depends on it. It never fails on a "blocked" answer, only on a
# harness error. Trigger with: gh workflow run web-cors.yml --ref <branch>

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-cors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translation-cors:
    name: translation-cors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Node version
        id: versions
        run: echo "node=$(jq -r .node web/spike/versions.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Install the npm packages (exact, from the lockfile)
        working-directory: web/spike
        run: npm ci --ignore-scripts

      - name: Install the browsers (Chromium, Firefox, WebKit)
        working-directory: web/spike
        run: npx playwright install --with-deps chromium firefox webkit

      # Fake keys only: this job has no secrets, and CI disables the real-key path in services.mjs.
      - name: "Raw probe (Node fetch, so every Access-Control-* header is visible)"
        working-directory: web/spike
        run: node cors/raw_probe.mjs

      - name: Browser probe (Chromium, Firefox, WebKit)
        working-directory: web/spike
        run: npx playwright test -c playwright.cors.config.ts

      - name: Report
        if: always()
        working-directory: web/spike
        run: |
          set -euo pipefail
          # The probes crashed before writing their JSON: there is nothing to report. Say so and
          # exit 0, so the failed probe step stays the visible root cause. A report.mjs crash on
          # present inputs is not hidden: that run fails.
          missing=""
          for f in out/cors-raw.json out/cors-browser-chromium.json out/cors-browser-firefox.json out/cors-browser-webkit.json; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::notice::No report: the probe output is missing ($missing). See the probe steps above."
            {
              echo "## W0.3 translation CORS"
              echo "No report: the probe output is missing ($missing). The probe step failed; see its log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node cors/report.mjs > /dev/null
          {
            echo "## W0.3 translation CORS"
            cat out/cors-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w0.3-translation-cors
          if-no-files-found: warn
          path: web/spike/out/
