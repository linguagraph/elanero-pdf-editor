name: Docs

# The website is assembled by scripts/build_site.py: the user guide (docs/guide, mkdocs.yml)
# under /guide/, built strictly, so broken links and pages missing from the nav fail the pull
# request; the landing page (docs/landing) at the root; and redirect stubs for the guide's old
# addresses. Pushes to main (and a manual run from main) publish the site to GitHub Pages.
# Pages must be set to "GitHub Actions" as its source (Settings > Pages) once.
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/build_site.py"
      - "src/pdfeditor/data/branding/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/build_site.py"
      - "src/pdfeditor/data/branding/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the docs tools pinned in pyproject.toml
        run: |
          python -c "import sys, subprocess, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['docs']; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])"
      - name: "Build the website (the user guide is built strictly: broken links and pages missing from the nav fail)"
        run: python scripts/build_site.py --site-dir site
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Only deploys queue on the Pages group: a pull request build never cancels or waits for one.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
