name: Web accessibility (W8.5)

# The W8.5 axe checks on the browser screens (web/app/e2e/features/axe.spec.ts): axe-core through
# @axe-core/playwright on the production build, on the start page and the dialogs that open with no
# document, in light and dark, in Chromium, Firefox and WebKit. Serious and critical findings fail
# the job; moderate and minor ones go to the step summary. Not a required check (W8.5 decision 1):
# it runs on demand only (workflow_dispatch, manual). It takes up to an hour, nothing depends on it,
# and it is not a required check. It is not run on PRs or on a schedule. It folds into web-e2e once
# W8.1 lands, and the owner decides about the ruleset then.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-a11y:
    name: web-a11y
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Node version
        id: versions
        shell: bash
        run: echo "node=$(jq -r .node web/spike/versions.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Install the npm packages (exact, from the lockfile)
        working-directory: web/app
        run: npm ci --ignore-scripts

      - name: Install the browsers (Chromium, Firefox, WebKit)
        working-directory: web/app
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run the axe checks (three browsers)
        working-directory: web/app
        run: npx playwright test -c playwright.features.config.ts e2e/features/axe.spec.ts

      - name: Upload the failure traces and axe reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-a11y-results
          path: web/app/test-results/
          if-no-files-found: ignore
