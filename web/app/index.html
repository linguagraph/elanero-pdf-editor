<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://api.mymemory.translated.net; img-src 'self' blob: data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; require-trusted-types-for 'script'"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="referrer" content="no-referrer" />
    <!-- react-aria's usePress injects <style id="react-aria-pressable-style"> unless an element with
         that id exists. style-src 'self' blocks that inline style, so this inert marker stops the
         injection; the same rule lives in src/app.css. -->
    <meta id="react-aria-pressable-style" />
    <title>Elanero</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
